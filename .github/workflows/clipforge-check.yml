name: ClipForge syntax check
on:
  push:
    paths:
      - 'clipforge_streamlit/**'
      - '.github/workflows/clipforge-check.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python app
        run: python -m py_compile clipforge_streamlit/app.py
      - name: Check FFmpeg availability
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
