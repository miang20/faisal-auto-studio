name: Shorts Studio APK
on:
  push:
    branches: [shorts-studio]
    paths: ['shorts-studio-app/**', '.github/workflows/shorts-studio-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        id: apk
        working-directory: shorts-studio-app
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/shorts-build.log"
      - name: Report failed build with actual error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Shorts Studio APK build failure'
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'Last 140 build log lines:'
            echo '~~~text'
            tail -n 140 "$RUNNER_TEMP/shorts-build.log" 2>/dev/null || echo 'Build did not reach Gradle step'
            echo '~~~'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Shorts Studio build failure run $GITHUB_RUN_ID" --body-file "$RUNNER_TEMP/issue.md" || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: shorts-studio-debug-apk
          path: shorts-studio-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
