name: Shorts Studio APK
on:
  push:
    branches: [shorts-studio]
    paths: ['shorts-studio-app/**', '.github/workflows/shorts-studio-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: shorts-studio-app
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-debug-apk
          path: shorts-studio-app/app/build/outputs/apk/debug/app-debug.apk
